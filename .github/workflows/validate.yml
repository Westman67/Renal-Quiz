name: Validate quiz

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify committed Pages bundle
        run: |
          test -f dist/index.html
          test -f dist/build-report.json
          bytes="$(du -sb dist | cut -f1)"
          echo "Pages bundle size is ${bytes} bytes"
          test "${bytes}" -lt 1000000000
