name: Validate quiz

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run engine tests
        run: npm test

      - name: Validate question bank
        run: python3 scripts/validate_bank.py data/source-manifest.json data/question-bank.json

      - name: Build static site
        run: npm run build

      - name: Verify committed distribution
        run: git diff --exit-code -- dist
